<div class="fixed top-5 right-5 flex flex-col gap-2 z-50 max-w-md">
    @for (toast of toasts$ | async; track toast.id) {
        <div
            [@toastAnimation]
            class="px-6 py-3 flex items-center gap-4 rounded shadow text-white font-semibold"
            [ngClass]="{
                'bg-success': toast.type === 'success',
                'bg-error': toast.type === 'error',
                'bg-info': toast.type === 'info',
                'bg-warning': toast.type === 'warning',
            }"
        >
            @if (toast.type === 'success') {
                <lucide-icon name="check-circle"></lucide-icon>
            } @else if (toast.type === 'error') {
                <lucide-icon name="circle-x"></lucide-icon>
            } @else if (toast.type === 'info') {
                <lucide-icon name="info"></lucide-icon>
            } @else if (toast.type === 'warning') {
                <lucide-icon name="triangle-alert"></lucide-icon>
            }
            {{ toast.message }}
            <button
                [ngClass]="{
                    'hover:bg-success-hover': toast.type === 'success',
                    'hover:bg-error-hover': toast.type === 'error',
                    'hover:bg-info-hover': toast.type === 'info',
                    'hover:bg-warning-hover': toast.type === 'warning',
                }"
                class="cursor-pointer rounded-lg p-1 transition-colors duration-200"
                (click)="removeToast(toast.id)"
            >
                <lucide-icon name="x"></lucide-icon>
            </button>
        </div>
    }
</div>
