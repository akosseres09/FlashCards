<header class="bg-surface-raised px-6 py-3 shadow-lg z-10">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <!-- Brand -->
        <a routerLink="/" class="flex items-center gap-3 no-underline">
            <flashcard-logo
                [width]="36"
                [height]="36"
                [showBottomMargin]="false"
                roundness="md"
            ></flashcard-logo>
            <span class="text-xl font-bold text-text-base tracking-tight">Flashcards</span>
        </a>

        <!-- Desktop nav -->
        <nav class="hidden md:flex items-center gap-2">
            @if (user$ | async; as user) {
                <a
                    routerLink="/projects"
                    routerLinkActive="!text-primary !bg-primary/10"
                    class="px-4 py-2 rounded-md font-semibold text-text-subtle hover:text-primary hover:bg-surface-overlay transition-all duration-200 no-underline"
                >
                    Projects
                </a>

                <!-- User avatar button -->
                <p-button
                    (onClick)="userMenu.toggle($event)"
                    [text]="true"
                    severity="secondary"
                    styleClass="!px-2 !py-1.5 rounded-md flex items-center gap-2"
                    aria-label="User menu"
                >
                    @if (user.photoURL) {
                        <p-avatar [image]="user.photoURL" shape="circle" size="normal" />
                    } @else {
                        <p-avatar
                            [label]="(user.email?.charAt(0) ?? 'U').toUpperCase()"
                            shape="circle"
                            size="normal"
                        />
                    }
                    <lucide-icon
                        name="chevron-down"
                        [size]="13"
                        class="text-text-muted"
                    ></lucide-icon>
                </p-button>

                <p-popover #userMenu styleClass="!p-0 !overflow-hidden">
                    <div class="flex flex-col min-w-48">
                        <div class="px-3 py-2 border-b border-surface-border">
                            <p class="text-sm text-text-muted mb-0.5">Signed in as</p>
                            <p class="font-semibold text-text-base truncate">
                                {{ user.email }}
                            </p>
                        </div>
                        <div class="p-1">
                            <a
                                routerLink="/settings"
                                (click)="userMenu.hide()"
                                class="flex items-center gap-3 px-3 py-2 font-medium text-text-subtle hover:text-primary hover:bg-surface-overlay rounded-md transition-colors no-underline"
                            >
                                <lucide-icon
                                    name="settings"
                                    [size]="15"
                                    [absoluteStrokeWidth]="true"
                                ></lucide-icon>
                                Settings
                            </a>
                            <hr class="border-surface-border my-1" />
                            <button
                                (click)="logout(); userMenu.hide()"
                                class="flex items-center gap-3 px-3 py-2 font-medium text-text-subtle hover:text-error hover:bg-error/5 rounded-md transition-colors w-full text-left cursor-pointer"
                            >
                                <lucide-icon
                                    name="log-out"
                                    [size]="15"
                                    [absoluteStrokeWidth]="true"
                                ></lucide-icon>
                                Logout
                            </button>
                        </div>
                    </div>
                </p-popover>
            } @else {
                <a
                    routerLink="/auth/login"
                    routerLinkActive="!text-primary"
                    class="px-4 py-2 font-semibold text-text-subtle hover:text-primary transition-colors duration-200 no-underline hover:bg-primary/10 rounded-md"
                >
                    Login
                </a>
                <p-button [routerLink]="['/auth/signup']" label="Sign Up" size="small" />
            }
        </nav>

        <!-- Mobile hamburger (wrapped in div so responsive hiding works on host) -->
        <div class="md:hidden">
            <p-button
                (onClick)="toggleMobileMenu()"
                [text]="true"
                severity="secondary"
                styleClass="!p-2"
                aria-label="Open navigation menu"
            >
                <lucide-icon name="menu" [size]="24"></lucide-icon>
            </p-button>
        </div>
    </div>
</header>

<!-- Mobile Drawer -->
<p-drawer [(visible)]="isMobileMenuOpen" position="right" [style]="{ width: '17rem' }">
    <ng-template pTemplate="header">
        <div class="flex items-center gap-3">
            <flashcard-logo
                [width]="28"
                [height]="28"
                [showBottomMargin]="false"
                roundness="md"
            ></flashcard-logo>
            <span class="font-bold text-text-base tracking-tight">Flashcards</span>
        </div>
    </ng-template>

    <div class="flex flex-col gap-1 py-2">
        @if (user$ | async; as user) {
            <!-- User info -->
            <div
                class="flex items-center gap-3 p-3 mb-2 bg-surface-overlay rounded-md border border-surface-border"
            >
                @if (user.photoURL) {
                    <p-avatar [image]="user.photoURL" shape="circle" size="large" />
                } @else {
                    <p-avatar
                        [label]="(user.email?.charAt(0) ?? 'U').toUpperCase()"
                        shape="circle"
                        size="large"
                    />
                }
                <div class="min-w-0">
                    <p class="text-sm text-text-muted">Signed in as</p>
                    <p class="font-semibold text-text-base truncate">{{ user.email }}</p>
                </div>
            </div>

            <a
                routerLink="/projects"
                routerLinkActive="!bg-primary/10 !text-primary"
                (click)="closeMobileMenu()"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-text-subtle font-medium hover:bg-surface-overlay transition-colors no-underline"
            >
                <lucide-icon name="folder-open" [size]="18"></lucide-icon>
                Projects
            </a>
            <a
                routerLink="/settings"
                (click)="closeMobileMenu()"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-text-subtle font-medium hover:bg-surface-overlay transition-colors no-underline"
            >
                <lucide-icon name="settings" [size]="18"></lucide-icon>
                Settings
            </a>

            <hr class="border-surface-border my-1" />

            <button
                (click)="logout()"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-text-subtle font-medium hover:bg-error/5 hover:text-error transition-colors w-full cursor-pointer"
            >
                <lucide-icon name="log-out" [size]="18"></lucide-icon>
                Logout
            </button>
        } @else {
            <a
                routerLink="/auth/login"
                routerLinkActive="!bg-primary/10 !text-primary"
                (click)="closeMobileMenu()"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-text-subtle font-medium hover:bg-surface-overlay transition-colors no-underline"
            >
                <lucide-icon name="log-in" [size]="18"></lucide-icon>
                Login
            </a>
            <a
                routerLink="/auth/signup"
                routerLinkActive="!bg-primary/10 !text-primary"
                (click)="closeMobileMenu()"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-text-subtle font-medium hover:bg-surface-overlay transition-colors no-underline"
            >
                <lucide-icon name="user-plus" [size]="18"></lucide-icon>
                Sign Up
            </a>
        }
    </div>
</p-drawer>
