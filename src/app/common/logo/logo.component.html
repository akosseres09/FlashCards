<div
    class="inline-flex items-center justify-center bg-primary shadow-xl shadow-primary/30"
    [style.width.px]="width()"
    [style.height.px]="height()"
    [class.mb-5]="showBottomMargin()"
    [ngClass]="roundnessClasses[roundness()]"
>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        class="text-white"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        [style.width.px]="width() * 0.6"
        [style.height.px]="height() * 0.6"
    >
        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
        />
    </svg>
</div>
