<footer class="bg-surface border-t border-surface-border">
    <div class="max-w-7xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- Brand -->
            <div class="col-span-1">
                <a routerLink="/" class="flex items-center gap-2 mb-4 no-underline">
                    <flashcard-logo
                        [width]="32"
                        [height]="32"
                        [showBottomMargin]="false"
                        roundness="md"
                    ></flashcard-logo>
                    <span class="text-xl font-bold text-text-base">Flashcards</span>
                </a>
                <p class="text-text-muted text-sm mb-4">
                    Master any subject with our intelligent flashcard learning platform.
                </p>
                <div class="flex gap-1">
                    <p-button
                        [text]="true"
                        severity="secondary"
                        size="small"
                        styleClass="!text-text-muted"
                        aria-label="Twitter"
                    >
                        <i class="pi pi-twitter"></i>
                    </p-button>
                    <p-button
                        [text]="true"
                        severity="secondary"
                        size="small"
                        styleClass="!text-text-muted"
                        aria-label="GitHub"
                    >
                        <i class="pi pi-github"></i>
                    </p-button>
                    <p-button
                        [text]="true"
                        severity="secondary"
                        size="small"
                        styleClass="!text-text-muted"
                        aria-label="LinkedIn"
                    >
                        <i class="pi pi-linkedin"></i>
                    </p-button>
                </div>
            </div>

            <!-- Product -->
            <div>
                <h3 class="text-text-base font-semibold mb-2">Product</h3>
                <ul class="list-none p-0 m-0 space-y-1">
                    <li>
                        <p-button
                            routerLink="/features"
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Features"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            routerLink="/pricing"
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Pricing"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            routerLink="/projects"
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Projects"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="API"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                </ul>
            </div>

            <!-- Company -->
            <div>
                <h3 class="text-text-base font-semibold mb-2">Company</h3>
                <ul class="list-none p-0 m-0 space-y-1">
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="About Us"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Blog"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Careers"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Contact"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                </ul>
            </div>

            <!-- Support -->
            <div>
                <h3 class="text-text-base font-semibold mb-2">Support</h3>
                <ul class="list-none p-0 m-0 space-y-1">
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Help Center"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Documentation"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Community"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                    <li>
                        <p-button
                            [text]="true"
                            severity="secondary"
                            size="small"
                            label="Status"
                            styleClass="!text-text-muted !px-0"
                        />
                    </li>
                </ul>
            </div>
        </div>

        <p-divider styleClass="!border-surface-border" />

        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-text-muted text-sm m-0">
                &copy; {{ currentYear }} Flashcards. All rights reserved.
            </p>
            <div class="flex gap-1">
                <p-button
                    [text]="true"
                    severity="secondary"
                    size="small"
                    label="Privacy Policy"
                    styleClass="!text-text-muted"
                />
                <p-button
                    [text]="true"
                    severity="secondary"
                    size="small"
                    label="Terms of Service"
                    styleClass="!text-text-muted"
                />
                <p-button
                    [text]="true"
                    severity="secondary"
                    size="small"
                    label="Cookie Policy"
                    styleClass="!text-text-muted"
                />
            </div>
        </div>
    </div>
</footer>
